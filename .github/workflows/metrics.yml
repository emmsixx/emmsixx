name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: write
    steps:
      - name: Generate profile metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: emmsixx
          template: terminal
          filename: github-metrics.svg
          committer_message: "chore: update profile metrics [Skip GitHub Action]"
          base: header
          config_timezone: America/Toronto
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_threshold: 2%

      - name: Generate activity metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: emmsixx
          template: terminal
          filename: github-activity.svg
          committer_message: "chore: update activity metrics [Skip GitHub Action]"
          base: activity
          config_timezone: America/Toronto
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
