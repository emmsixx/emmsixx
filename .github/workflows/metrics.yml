name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: write
    steps:
      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: emmsixx
          template: classic
          filename: github-metrics.svg
          committer_message: "chore: update profile metrics [Skip GitHub Action]"
          base: header
          config_timezone: America/Toronto
          config_display: columns
          config_animations: no
          config_padding: 0, 16
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          extras_css: |
            :root {
              --color-calendar-graph-day-bg: #171014;
              --color-calendar-graph-day-border: #2a1a20;
              --color-calendar-graph-day-L1-bg: #421325;
              --color-calendar-graph-day-L2-bg: #7d1938;
              --color-calendar-graph-day-L3-bg: #a91d46;
              --color-calendar-graph-day-L4-bg: #d21f50;
            }

            svg {
              color: #ad909b;
              background: #0d0a0c;
            }

            .items-wrapper {
              box-sizing: border-box;
              padding: 14px;
              color: #ad909b;
              background: #0d0a0c;
              border: 1px solid #2a1a20;
              border-radius: 10px;
            }

            h1,
            h2 {
              color: #e9dee2;
            }

            h3 {
              color: #c2a6b0;
            }

            .field svg {
              fill: #816672;
            }

            .avatar {
              filter: grayscale(1) contrast(1.05);
              box-shadow: 0 0 0 2px #2a1a20;
            }

            footer,
            small {
              color: #816672;
            }

            [fill="#ebedf0"] {
              fill: #171014;
            }

            [fill="#9be9a8"] {
              fill: #421325;
            }

            [fill="#40c463"] {
              fill: #7d1938;
            }

            [fill="#30a14e"] {
              fill: #a91d46;
            }

            [fill="#216e39"] {
              fill: #d21f50;
            }
